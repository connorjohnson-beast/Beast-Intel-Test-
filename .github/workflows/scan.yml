name: Beast Intel Sweep

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: beast-intel-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run the sweep
        run: python3 fetch_intel.py

      - name: Publish the updated dashboard
        run: |
          git config user.name "beast-intel-bot"
          git config user.email "actions@users.noreply.github.com"
          git add live_findings.json seen.json dashboard.html
          git diff --quiet --cached || git commit -m "Automatic sweep update"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break
            echo "retrying..."
            sleep 5
          done
