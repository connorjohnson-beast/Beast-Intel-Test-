function Sparkline({ data, color = '#34d399', width = 76, height = 22 }) {
  const max = Math.max(...data, 1);
  const min = Math.min(...data, 0);
  const range = max - min || 1;
  const points = data.map((d, i) => {
    const x = (i / (data.length - 1)) * width;
    const y = height - ((d - min) / range) * height;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  return (
    <svg width={width} height={height} className="overflow-visible shrink-0">
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function ReliabilityDots({ score }) {
  return (
    <div className="flex items-center space-x-0.5" title={`Source reliability ${score}/5`}>
      {[1, 2, 3, 4, 5].map(i => (
        <span key={i} className={`w-1.5 h-1.5 rounded-full ${i <= score ? 'bg-emerald-400' : 'bg-slate-700'}`} />
      ))}
    </div>
  );
}

function StatusStepper({ status, onChange }) {
  const currentIdx = STATUS_STAGES.indexOf(status);
  return (
    <div className="flex items-center flex-wrap gap-1.5">
      {STATUS_STAGES.map((stage, i) => {
        const done = i <= currentIdx;
        return (
          <button key={stage} onClick={() => onChange(stage)} className={`text-[10px] font-semibold px-2 py-1 rounded-full border transition-colors ${done ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-300 hover:border-slate-600'}`}>
            {stage}
          </button>
        );
      })}
    </div>
  );
}

function KpiCard({ icon: Icon, label, value, sub, accent }) {
  return (
    <div className="bg-slate-800/90 border border-slate-700 rounded-2xl p-5 flex items-center justify-between shadow-xl">
      <div>
        <p className="text-[11px] text-slate-400">{label}</p>
        <p className="text-2xl font-bold text-slate-100 mt-1">{value}</p>
        {sub && <p className="text-[11px] text-slate-400 mt-0.5">{sub}</p>}
      </div>
      <div className={`p-2.5 rounded-xl ${accent}`}>
        <Icon className="w-5 h-5" />
      </div>
    </div>
  );
}

    let base = searchInput.trim();
    if (!base && activeKeywordTags.length > 0) base = activeKeywordTags.map(t => `"${t}"`).join(' OR ');
    if (dorkOperator === 'PASTE') base = `site:pastebin.com OR site:justpaste.it ${base}`;
    if (dorkOperator === 'FORUMS') base = `site:reddit.com OR site:4chan.org ${base}`;
    if (dorkOperator === 'DOCS') base = `filetype:pdf OR filetype:xlsx "CONFIDENTIAL" ${base}`;
    if (dorkOperator === 'EXACT_PII') base = `${base} "Home Address" OR "Cell" OR "SSN"`;
    if (dorkOperator === 'BRAND') base = `${base} -site:{DOMAIN} "{COMPANY}"`;
    return base || '"Executive Name" "Home Address"';
  }, [searchInput, activeKeywordTags, dorkOperator]);

  const categoryCounts = useMemo(() => {
    const counts = {};
    CATEGORY_KEYS.forEach(k => (counts[k] = 0));
    searchResults.forEach(res => { if (counts[res.category] !== undefined) counts[res.category]++; });
    return counts;
  }, [searchResults]);

  const statusCounts = useMemo(() => {
    const counts = {};
    STATUS_STAGES.forEach(s => (counts[s] = 0));
    searchResults.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });
    return counts;
  }, [searchResults]);

  const filteredResults = useMemo(() => {
    const filtered = searchResults.filter(res => {
      const matchesCategory = activeCategoryTab === 'ALL' || res.category === activeCategoryTab;
      const matchesSeverity = selectedSeverity === 'ALL' || res.severity === selectedSeverity;
      const matchesStatus = selectedStatus === 'ALL' || res.status === selectedStatus;
      const matchesAssignee = selectedAssignee === 'ALL' || res.assignee === selectedAssignee;
      return matchesCategory && matchesSeverity && matchesStatus && matchesAssignee;
    });
    const getTime = r => r.detectedAtEpoch || 0;
    const sorted = [...filtered];
    if (sortBy === 'newest') sorted.sort((a, b) => getTime(b) - getTime(a));
    else if (sortBy === 'oldest') sorted.sort((a, b) => getTime(a) - getTime(b));
    else if (sortBy === 'riskHigh') sorted.sort((a, b) => b.riskScore - a.riskScore);
    else if (sortBy === 'riskLow') sorted.sort((a, b) => a.riskScore - b.riskScore);
    return sorted;
  }, [searchResults, activeCategoryTab, selectedSeverity, selectedStatus, selectedAssignee, sortBy]);

  const openCriticalCount = searchResults.filter(r => r.severity === 'Critical' && r.status !== 'Resolved').length;
  const openCasesCount = searchResults.filter(r => r.status !== 'Resolved').length;
  const avgRisk = Math.round(searchResults.reduce((a, r) => a + r.riskScore, 0) / (searchResults.length || 1));
  const categoryChartData = CATEGORY_KEYS.map(k => ({ name: k, value: categoryCounts[k], color: CATEGORY_STYLES[k].chart }));

  // Opens the constructed query on a real search engine in a new tab —
  // genuinely free, no API, no key, can't be rate-limited or shut off by a
  // vendor policy change. You do the searching; the app just hands you the
  // query pre-built (including any dork operators/templates).
  const handleOpenInBrowser = engine => {
    const q = encodeURIComponent(constructedSearchQuery);
    const urls = {
      google: `https://www.google.com/search?q=${q}`,
      bing: `https://www.bing.com/search?q=${q}`,
      duckduckgo: `https://duckduckgo.com/?q=${q}`
    };
    window.open(urls[engine] || urls.google, '_blank', 'noopener,noreferrer');
  };

  const handleApplyTemplate = template => {
    setSearchInput(template);
  };

  const handleAddManualResult = () => {
    if (!manualDraft.title.trim() || !manualDraft.url.trim()) return;
    const severityRisk = { Critical: 90, High: 70, Medium: 50, Low: 25 };
    const newResult = {
      id: `RES-MANUAL-${Date.now()}`,
      keywordMatched: constructedSearchQuery,
      category: manualDraft.category,
      severity: manualDraft.severity,
      riskScore: severityRisk[manualDraft.severity] || 50,
      confidence: 100,
      source: manualDraft.source.trim() || 'Manually added',
      sourceType: 'Web Search',
      title: manualDraft.title.trim(),
      snippet: manualDraft.snippet.trim(),
      detectedAt: 'Just now',
      detectedAtEpoch: Date.now(),
      url: manualDraft.url.trim(),
      status: 'New',
      assignee: 'Unassigned',
      tags: ['manual entry'],
      notes: [],
      isDemo: false
    };
    setSearchResults(prev => [newResult, ...prev]);
    setManualDraft({ title: '', url: '', source: '', category: CATEGORY_KEYS[0], severity: 'Medium', snippet: '' });
    setShowManualForm(false);
  };

  const handleAddTag = e => {
    e.preventDefault();
    if (newTagInput.trim() && !activeKeywordTags.includes(newTagInput.trim())) {
      setActiveKeywordTags([...activeKeywordTags, newTagInput.trim()]);
      setNewTagInput('');
    }
  };

  const handleRemoveTag = tag => setActiveKeywordTags(activeKeywordTags.filter(t => t !== tag));

  const handleSaveCurrentKeyword = () => {
    const term = searchInput.trim() || activeKeywordTags.join(', ');
    if (!term) return;
    setSavedKeywords([{ id: `kw-${Date.now()}`, query: term, active: true, hitsToday: 1, category: activeCategoryTab === 'ALL' ? CATEGORY_KEYS[0] : activeCategoryTab, trend: [0, 0, 0, 0, 0, 1, 1] }, ...savedKeywords]);
  };

  const handleStatusChange = (id, newStatus) => {
    setSearchResults(prev => prev.map(r => r.id === id ? { ...r, status: newStatus, notes: [...r.notes, { author: 'You', text: `Status moved to "${newStatus}".`, at: 'Just now' }] } : r));
    setSelectedResult(prev => (prev && prev.id === id ? { ...prev, status: newStatus, notes: [...prev.notes, { author: 'You', text: `Status moved to "${newStatus}".`, at: 'Just now' }] } : prev));
  };

  const handleAssign = (id, assignee) => {
    setSearchResults(prev => prev.map(r => (r.id === id ? { ...r, assignee } : r)));
    setSelectedResult(prev => (prev && prev.id === id ? { ...prev, assignee } : prev));
  };

  const handleAddNote = id => {
    if (!noteDraft.trim()) return;
    const note = { author: 'You', text: noteDraft.trim(), at: 'Just now' };
    setSearchResults(prev => prev.map(r => (r.id === id ? { ...r, notes: [...r.notes, note] } : r)));
    setSelectedResult(prev => (prev && prev.id === id ? { ...prev, notes: [...prev.notes, note] } : prev));
    setNoteDraft('');
  };

  const handleExportReport = () => {
    const lines = [
      `BEAST OSINT TEST — MONITORING LOG`,
      `Generated: ${new Date().toISOString()}`,
      `Filter: category=${activeCategoryTab} severity=${selectedSeverity} status=${selectedStatus} assignee=${selectedAssignee}`,
      `Results: ${filteredResults.length}`, '',
      ...filteredResults.map(r => `[${r.id}] ${r.severity.toUpperCase()} — ${r.title}\n  Category: ${r.category}\n  Source: ${r.source} (reliability ${SOURCE_RELIABILITY[r.sourceType] || 3}/5)\n  Matched: "${r.keywordMatched}"\n  Status: ${r.status} | Assignee: ${r.assignee}\n  URL: ${r.url}\n`)
    ];
    const blob = new Blob([lines.join('\n')], { type: 'text/plain' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `aegis-report-${Date.now()}.txt`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  };

  return (
    <div className="min-h-screen bg-slate-900 text-slate-100 font-sans flex flex-col selection:bg-emerald-500 selection:text-slate-950">
      <header className="border-b border-slate-700 bg-slate-800/90 backdrop-blur sticky top-0 z-40 px-4 lg:px-6 py-3 flex flex-wrap items-center justify-between gap-4">
        <div className="flex items-center space-x-3">
          <div className="relative bg-gradient-to-br from-emerald-500 to-teal-600 p-2 rounded-lg shadow-lg shadow-emerald-500/20">
            <Radio className="w-5 h-5 text-slate-950 stroke-[2.5]" />
          </div>
          <div>
            <div className="flex items-center space-x-2">
              <h1 className="text-base font-bold tracking-tight text-slate-100">Beast OSINT Test</h1>
              <span className="px-2 py-0.5 text-[10px] font-medium bg-emerald-500/20 text-emerald-300 border border-emerald-500/40 rounded-full">Live — updated Nov 09, 2026 7:57 PM EST</span>
            </div>
            <p className="text-xs text-slate-400 hidden sm:block">Search the web for mentions, then keep a simple log of what you find</p>
          </div>
        </div>
        <div className="flex items-center space-x-2">
          <button onClick={handleExportReport} title="Download everything below as a text file" className="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium flex items-center space-x-1.5">
            <Download className="w-3.5 h-3.5" />
            <span className="hidden sm:inline">Download log</span>
          </button>
          <button onClick={() => handleOpenInBrowser('google')} className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg text-xs flex items-center space-x-1.5 transition-colors">
            <ExternalLink className="w-3.5 h-3.5" />
            <span>Search in Google</span>
          </button>
        </div>
      </header>

      <div className="px-4 lg:px-6 pt-4 max-w-7xl mx-auto w-full space-y-3">
        <div className="bg-slate-800/70 border border-slate-700 rounded-xl px-4 py-3 flex items-start space-x-2.5 text-xs text-slate-400">
          <Globe className="w-4 h-4 shrink-0 mt-0.5 text-emerald-400" />
          <p><span className="text-slate-300 font-medium">How this works:</span> type a name or company below, pick a ready-made search or write your own, then click a search engine button. When you find something worth tracking, click "Log a finding" to save it to the list underneath so the team can follow up.</p>
        </div>
        <div className="bg-emerald-500/10 border border-emerald-500/30 rounded-xl px-4 py-2.5 flex items-center space-x-2.5 text-xs text-emerald-300">
          <RefreshCw className="w-3.5 h-3.5 shrink-0" />
          <span>Sources checked this sweep: Bing News, Google News, Hackernews · 84 results found · last swept Nov 09, 2026 7:57 PM EST</span>
        </div>
      </div>

      <main className="flex-1 px-4 lg:px-6 py-8 max-w-7xl mx-auto w-full space-y-8">
        <section className="grid grid-cols-2 lg:grid-cols-4 gap-5">
          <KpiCard icon={ShieldAlert} label="Needs urgent attention" value={openCriticalCount} sub="Highest severity, not yet resolved" accent="bg-rose-950/70 text-rose-400" />
          <KpiCard icon={History} label="Still open" value={openCasesCount} sub={`${statusCounts.Resolved} resolved so far`} accent="bg-slate-700 text-slate-300" />
          <KpiCard icon={Gauge} label="Average risk score" value={`${avgRisk}/100`} sub="Across everything found so far" accent="bg-amber-950/70 text-amber-400" />
          <KpiCard icon={Bookmark} label="Searches being watched" value={savedKeywords.filter(k => k.active).length} sub={`${savedKeywords.length} saved in total`} accent="bg-emerald-950/70 text-emerald-400" />
        </section>

        <section className="grid grid-cols-1 lg:grid-cols-3 gap-8">
          <div className="lg:col-span-2 bg-slate-800/90 border border-slate-700 rounded-2xl p-6 space-y-5 shadow-xl">
            <div className="flex items-center justify-between">
              <h3 className="text-xs font-bold text-slate-200 flex items-center space-x-2">
                <Search className="w-4 h-4 text-emerald-400" />
                <span>Build a search</span>
              </h3>
              <label className="flex items-center space-x-2 text-xs">
                <span className="text-slate-400 hidden sm:inline">Narrow it to:</span>
                <select value={dorkOperator} onChange={e => setDorkOperator(e.target.value)} title="Narrows your search to a specific kind of site" className="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-3 py-1.5 focus:outline-none focus:border-emerald-500">
                  <option value="NONE">Everywhere (default)</option>
                  <option value="PASTE">Leak/paste sites</option>
                  <option value="FORUMS">Forums & social media</option>
                  <option value="DOCS">Leaked documents</option>
                  <option value="EXACT_PII">Exact personal info (address, SSN, etc.)</option>
                  <option value="BRAND">Fake/impersonation pages</option>
                </select>
              </label>
            </div>
            <div className="flex flex-wrap gap-2">
              {activeKeywordTags.map(tag => (
                <span key={tag} className="flex items-center space-x-1.5 bg-slate-700 border border-slate-600 text-slate-200 text-xs px-2.5 py-1 rounded-full">
                  <span>{tag}</span>
                  <button onClick={() => handleRemoveTag(tag)} className="text-slate-400 hover:text-rose-400"><X className="w-3 h-3" /></button>
                </span>
              ))}
              <form onSubmit={handleAddTag} className="flex items-center">
                <input value={newTagInput} onChange={e => setNewTagInput(e.target.value)} placeholder="Add a name or company..." className="bg-slate-900 border border-dashed border-slate-600 text-xs text-slate-200 placeholder-slate-500 rounded-full px-3 py-1 w-44 focus:outline-none focus:border-emerald-500" />
                <button type="submit" className="ml-1 text-emerald-400 hover:text-emerald-300"><PlusCircle className="w-4 h-4" /></button>
              </form>
            </div>
            <div>
              <p className="text-[10px] text-slate-400 mb-1.5">Quick-start searches — click one, then replace the {'{'}placeholders{'}'} below with the real name, company, or email:</p>
              <div className="flex flex-wrap gap-1.5">
                {DORK_TEMPLATES.map(t => (
                  <button key={t.label} onClick={() => handleApplyTemplate(t.query)} className="text-[10px] px-2.5 py-1 bg-slate-700 hover:bg-slate-600 text-slate-300 rounded-full border border-slate-600">
                    {t.label}
                  </button>
                ))}
              </div>
            </div>
            <div className="bg-slate-900 border border-slate-700 rounded-lg p-3 font-mono text-[11px] text-emerald-300 break-all">{constructedSearchQuery}</div>
            <div className="flex items-center justify-between">
              <input value={searchInput} onChange={e => setSearchInput(e.target.value)} placeholder="...or just type your own search here" className="flex-1 bg-slate-900 border border-slate-700 text-xs text-slate-200 placeholder-slate-500 rounded-lg px-3 py-2 mr-3 focus:outline-none focus:border-emerald-500" />
              <button onClick={handleSaveCurrentKeyword} title="Keep an eye on this search going forward" className="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg flex items-center space-x-1.5 shrink-0">
                <Bookmark className="w-3.5 h-3.5" /><span>Watch this search</span>
              </button>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={() => handleOpenInBrowser('google')} className="flex-1 px-3 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 text-xs font-bold rounded-lg flex items-center justify-center space-x-1.5">
                <ExternalLink className="w-3.5 h-3.5" /><span>Google</span>
              </button>
              <button onClick={() => handleOpenInBrowser('bing')} className="flex-1 px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg flex items-center justify-center space-x-1.5">
                <ExternalLink className="w-3.5 h-3.5" /><span>Bing</span>
              </button>
              <button onClick={() => handleOpenInBrowser('duckduckgo')} className="flex-1 px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-medium rounded-lg flex items-center justify-center space-x-1.5">
                <ExternalLink className="w-3.5 h-3.5" /><span>DuckDuckGo</span>
              </button>
            </div>
            <p className="text-[11px] text-slate-400 flex items-start space-x-1.5 pt-1">
              <Globe className="w-3.5 h-3.5 shrink-0 mt-0.5" />
              <span>These buttons open your search in a new browser tab, using a real search engine — nothing here happens automatically. When you spot something worth tracking, come back and click "Log a finding" below to save it.</span>
            </p>
          </div>

          <div className="space-y-8">
          <div className="bg-slate-800/90 border border-slate-700 rounded-2xl p-6 space-y-4 shadow-xl">
            <h3 className="text-xs font-bold text-slate-200 flex items-center space-x-2">
              <TrendingUp className="w-4 h-4 text-emerald-400" /><span>Findings over the last 14 days</span>
            </h3>
            <div className="h-32 w-full">
              <ResponsiveContainer width="100%" height="100%">
                <AreaChart data={TIMELINE_DATA} margin={{ top: 4, right: 4, left: -20, bottom: 0 }}>
                  <defs>
                    <linearGradient id="hitsFill" x1="0" y1="0" x2="0" y2="1">
                      <stop offset="0%" stopColor="#34d399" stopOpacity={0.5} />
                      <stop offset="100%" stopColor="#34d399" stopOpacity={0} />
                    </linearGradient>
                  </defs>
                  <CartesianGrid stroke="#334155" vertical={false} />
                  <XAxis dataKey="day" hide />
                  <YAxis tick={{ fontSize: 10, fill: '#64748b' }} width={24} />
                  <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', borderRadius: '8px', fontSize: '11px' }} />
                  <Area type="monotone" dataKey="hits" stroke="#34d399" strokeWidth={2} fill="url(#hitsFill)" />
                </AreaChart>
              </ResponsiveContainer>
            </div>
            <p className="text-[11px] text-slate-400">How many new findings turned up each day, across everything you're watching.</p>
          </div>

          <div className="bg-slate-800/90 border border-slate-700 rounded-2xl p-6 space-y-5 shadow-xl">
            <h3 className="text-xs font-bold text-slate-200 flex items-center space-x-2 border-b border-slate-700 pb-3"><BarChart3 className="w-4 h-4 text-emerald-400" /><span>Findings by type</span></h3>
            {searchResults.length === 0 ? (
              <div className="h-48 flex flex-col items-center justify-center text-center text-slate-500 space-y-1">
                <BarChart3 className="w-8 h-8 text-slate-600" />
                <p className="text-xs">Nothing logged yet.</p>
                <p className="text-[11px] text-slate-600">This fills in once you log some findings.</p>
              </div>
            ) : (
              <>
                <div className="h-48 w-full">
                  <ResponsiveContainer width="100%" height="100%">
                    <PieChart>
                      <Pie data={categoryChartData} cx="50%" cy="50%" innerRadius={42} outerRadius={70} paddingAngle={4} dataKey="value">
                        {categoryChartData.map((entry, index) => <Cell key={`cell-${index}`} fill={entry.color} />)}
                      </Pie>
                      <Tooltip contentStyle={{ backgroundColor: '#1e293b', borderColor: '#475569', borderRadius: '8px', fontSize: '11px' }} />
                    </PieChart>
                  </ResponsiveContainer>
                </div>
                <div className="grid grid-cols-1 gap-1.5 text-[11px] pt-2 border-t border-slate-700">
                  {categoryChartData.map(item => (
                    <div key={item.name} className="flex items-center space-x-1.5">
                      <span className="w-2 h-2 rounded-full shrink-0" style={{ backgroundColor: item.color }} />
                      <span className="text-slate-400 truncate flex-1">{item.name}</span>
                      <span className="font-mono font-bold text-slate-200">{item.value}</span>
                    </div>
                  ))}
                </div>
              </>
            )}
          </div>
          </div>
        </section>

        <section className="bg-slate-800/90 border border-slate-700 rounded-2xl overflow-hidden shadow-xl">
          <div className="px-5 py-3.5 border-b border-slate-700 flex items-center justify-between flex-wrap gap-2">
            <div className="flex items-center space-x-2">
              <Flame className="w-4 h-4 text-emerald-400" />
              <h3 className="text-xs font-bold text-slate-200">Latest findings ({filteredResults.length})</h3>
            </div>
            <div className="flex items-center gap-2">
              <select value={sortBy} onChange={e => setSortBy(e.target.value)} className="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-emerald-500">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="riskHigh">Highest risk first</option>
                <option value="riskLow">Lowest risk first</option>
              </select>
              <select value={activeCategoryTab} onChange={e => setActiveCategoryTab(e.target.value)} className="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-emerald-500">
                <option value="ALL">All categories</option>
                {CATEGORY_KEYS.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={selectedSeverity} onChange={e => setSelectedSeverity(e.target.value)} className="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-emerald-500">
                <option value="ALL">All ratings</option><option value="Critical">Critical</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option>
              </select>
              <button onClick={() => setShowManualForm(v => !v)} title="Manually add something you found yourself" className="text-[11px] px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 rounded-lg border border-emerald-500/30 flex items-center space-x-1">
                <PlusCircle className="w-3.5 h-3.5" /><span>Log a finding</span>
              </button>
            </div>
          </div>
          {showManualForm && (
            <div className="p-5 bg-slate-900 border-b border-dashed border-slate-600 space-y-2 text-xs">
              <div className="grid grid-cols-2 gap-2">
                <input value={manualDraft.title} onChange={e => setManualDraft({ ...manualDraft, title: e.target.value })} placeholder="What did you find? (short title)" className="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
                <input value={manualDraft.url} onChange={e => setManualDraft({ ...manualDraft, url: e.target.value })} placeholder="Link to the page" className="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
              </div>
              <input value={manualDraft.source} onChange={e => setManualDraft({ ...manualDraft, source: e.target.value })} placeholder="Where did you find it?" className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
              <div className="grid grid-cols-2 gap-2">
                <select value={manualDraft.category} onChange={e => setManualDraft({ ...manualDraft, category: e.target.value })} className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-300 focus:outline-none focus:border-emerald-500">
                  {CATEGORY_KEYS.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <select value={manualDraft.severity} onChange={e => setManualDraft({ ...manualDraft, severity: e.target.value })} className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-300 focus:outline-none focus:border-emerald-500">
                  {['Low', 'Medium', 'High', 'Critical'].map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <button onClick={handleAddManualResult} className="w-full py-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg">Save this finding</button>
            </div>

          {filteredResults.length === 0 ? (
            <div className="p-12 text-center text-slate-400 space-y-2">
              <ShieldCheck className="w-10 h-10 mx-auto text-slate-500" />
              <p className="text-xs font-medium">Nothing here yet.</p>
              <p className="text-[11px] text-slate-500">The next scheduled sweep will fill this in.</p>
            </div>
          ) : (
            <div className="divide-y divide-slate-700/60">
              {filteredResults.map(result => (
                <div key={result.id} className="p-4 hover:bg-slate-700/20 transition-all flex flex-wrap items-start gap-3">
                  <div className={`shrink-0 w-16 text-center px-2 py-1.5 rounded-lg border text-[11px] font-bold ${SEVERITY_STYLES[result.severity]}`} title="Rating — how serious this looks">
                    <div>{result.severity.toUpperCase()}</div>
                    <div className="font-mono text-[10px] opacity-80">{result.riskScore}/100</div>
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center flex-wrap gap-1.5 mb-1">
                      <span className={`text-[10px] font-medium px-1.5 py-0.5 rounded border ${CATEGORY_STYLES[result.category].text} ${CATEGORY_STYLES[result.category].softBg} ${CATEGORY_STYLES[result.category].border}`}>{result.category}</span>
                      <span className="text-[10px] text-slate-500">{result.source}</span>
                      <span className="text-[10px] text-slate-500 flex items-center"><Clock className="w-3 h-3 mr-0.5" />{result.detectedAt}</span>
                    </div>
                    <a href={result.url} target="_blank" rel="noopener noreferrer" className="text-sm font-semibold text-slate-100 hover:text-emerald-300 hover:underline flex items-center gap-1.5">
                      <span>{result.title}</span><ExternalLink className="w-3.5 h-3.5 shrink-0 opacity-60" />
                    </a>
                    <p className="text-xs text-slate-400 mt-1 line-clamp-2">{result.snippet}</p>
                  </div>
                  <button onClick={() => setSelectedResult(result)} className="shrink-0 px-2.5 py-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 text-[11px] font-medium rounded border border-slate-600 flex items-center space-x-1">
                    <Eye className="w-3 h-3" /><span>Details</span>
                  </button>
                </div>
              ))}
            </div>
          )}
        </section>
      </main>

      {selectedResult && (
        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-5">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-700 pb-3">
              <div className="flex items-center space-x-2"><ShieldAlert className="w-5 h-5 text-rose-500" /><span className="text-xs font-mono font-bold text-slate-300">Finding #{selectedResult.id}</span></div>
              <button onClick={() => setSelectedResult(null)} className="text-slate-400 hover:text-slate-200"><X className="w-5 h-5" /></button>
            </div>
            <div className="space-y-4 text-xs">
              <div>
                <span className={`text-[10px] font-medium ${CATEGORY_STYLES[selectedResult.category].text}`}>{selectedResult.category}</span>
                <h3 className="text-base font-bold text-slate-100">{selectedResult.title}</h3>
              </div>
              <div>
                <p className="text-slate-400 mb-1.5">Where this stands — click a step to update it</p>
                <StatusStepper status={selectedResult.status} onChange={s => handleStatusChange(selectedResult.id, s)} />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2 font-mono text-[11px]">
                  <div className="flex justify-between"><span className="text-slate-400">Found via search:</span><span className="text-emerald-400 font-bold truncate ml-2">"{selectedResult.keywordMatched}"</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Found on:</span><span className="text-slate-300">{selectedResult.source}</span></div>
                  <div className="flex justify-between" title="How serious this looks, out of 100"><span className="text-slate-400">Risk score:</span><span className="text-rose-400 font-bold">{selectedResult.riskScore}/100</span></div>
                  <div className="flex justify-between items-center" title="How trustworthy this type of source usually is"><span className="text-slate-400">Source trust:</span><div className="flex items-center space-x-1.5"><ReliabilityDots score={SOURCE_RELIABILITY[selectedResult.sourceType] || 3} /><span className="text-slate-400">{SOURCE_RELIABILITY[selectedResult.sourceType] || 3}/5</span></div></div>
                </div>
                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2">
                  <p className="text-slate-400 flex items-center"><Users className="w-3 h-3 mr-1" />Who's handling this</p>
                  <select value={selectedResult.assignee} onChange={e => handleAssign(selectedResult.id, e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                    {TEAM.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                  <p className="text-slate-400 flex items-center pt-1"><MapPin className="w-3 h-3 mr-1" />Tags</p>
                  <div className="flex flex-wrap gap-1">
                    {selectedResult.tags.map(t => <span key={t} className="text-[10px] bg-slate-800 border border-slate-700 text-slate-400 px-1.5 py-0.5 rounded">{t}</span>)}
                  </div>
                </div>
              </div>
              <div>
                <span className="text-slate-400 font-semibold block mb-1">What was found</span>
                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 text-slate-300 leading-relaxed text-xs max-h-32 overflow-y-auto">{selectedResult.snippet}</div>
              </div>
              <div>
                <span className="text-slate-400 font-semibold flex items-center mb-1"><History className="w-3.5 h-3.5 mr-1.5" />Activity on this finding</span>
                <div className="space-y-1.5 max-h-32 overflow-y-auto">
                  {selectedResult.notes.length === 0 && <p className="text-slate-400 text-[11px]">No notes yet — add one below.</p>}
                  {selectedResult.notes.map((n, i) => (
                    <div key={i} className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-[11px]">
                      <div className="flex items-center justify-between text-slate-400"><span className="font-semibold text-slate-300">{n.author}</span><span>{n.at}</span></div>
                      <p className="text-slate-400 mt-0.5">{n.text}</p>
                    </div>
                  ))}
                </div>
                <div className="flex items-center space-x-2 mt-2">
                  <input value={noteDraft} onChange={e => setNoteDraft(e.target.value)} placeholder="Add a note for the team..." className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
                  <button onClick={() => handleAddNote(selectedResult.id)} className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg font-medium shrink-0">Add</button>
                </div>
              </div>
            </div>
            <div className="pt-3 border-t border-slate-700 flex flex-wrap items-center justify-between gap-4">
              <a href={selectedResult.url} target="_blank" rel="noopener noreferrer" className="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium flex items-center space-x-1"><span>Open the page</span><ExternalLink className="w-3.5 h-3.5" /></a>
              <div className="flex space-x-2">
                <button onClick={() => { navigator.clipboard.writeText(`TAKEDOWN REQUEST FOR: ${selectedResult.url}\nMATCHED KEYWORD: ${selectedResult.keywordMatched}\nCONTENT: ${selectedResult.snippet}`); setCopyFeedback(true); setTimeout(() => setCopyFeedback(false), 2500); }} title="Copies a pre-written removal request you can paste into an email or web form" className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg text-xs flex items-center space-x-1">
                  <FileText className="w-3.5 h-3.5" /><span>{copyFeedback ? 'Copied!' : 'Copy removal request'}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const __root = ReactDOM.createRoot(document.getElementById('root'));
__root.render(React.createElement(App));

</script>

<script>
  try {
    var code = document.getElementById('app-source').textContent;
    var transformed = Babel.transform(code, { presets: ['react'] }).code;
    var script = document.createElement('script');
    script.textContent = transformed;
    document.body.appendChild(script);
  } catch (err) {
    document.getElementById('root').innerHTML =
      '<div style="color:#f87171;padding:2rem;font-family:sans-serif;">Failed to start the app: ' + (err && err.message ? err.message : err) + '</div>';
    console.error(err);
  }
</script>
</body>
</html>
