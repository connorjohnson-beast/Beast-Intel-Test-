  return (
    <svg width={width} height={height} className="overflow-visible shrink-0">
      <polyline points={points} fill="none" stroke={color} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round" />
    </svg>
  );
}

function ReliabilityDots({ score }) {
  return (
    <div className="flex items-center space-x-0.5" title={`Source reliability ${score}/5`}>
      {[1, 2, 3, 4, 5].map(i => (
        <span key={i} className={`w-1.5 h-1.5 rounded-full ${i <= score ? 'bg-emerald-400' : 'bg-slate-700'}`} />
      ))}
    </div>
  );
}

function StatusStepper({ status, onChange }) {
  const currentIdx = STATUS_STAGES.indexOf(status);
  return (
    <div className="flex items-center flex-wrap gap-1.5">
      {STATUS_STAGES.map((stage, i) => {
        const done = i <= currentIdx;
        return (
          <button key={stage} onClick={() => onChange(stage)} className={`text-[10px] font-semibold px-2 py-1 rounded-full border transition-colors ${done ? 'bg-emerald-500/15 border-emerald-500/40 text-emerald-300' : 'bg-slate-900 border-slate-700 text-slate-400 hover:text-slate-300 hover:border-slate-600'}`}>
            {stage}
          </button>
        );
      })}
    </div>
  );
}

function KpiCard({ icon: Icon, label, value, sub, accent }) {
  return (
    <div className="bg-slate-800/90 border border-slate-700 rounded-2xl p-5 flex items-center justify-between shadow-xl">
      <div>
        <p className="text-[11px] text-slate-400">{label}</p>
        <p className="text-2xl font-bold text-slate-100 mt-1">{value}</p>
        {sub && <p className="text-[11px] text-slate-400 mt-0.5">{sub}</p>}
      </div>
      <div className={`p-2.5 rounded-xl ${accent}`}>
        <Icon className="w-5 h-5" />
      </div>
    </div>
  );
}

function App() {
  const [searchResults, setSearchResults] = useState(INITIAL_SEARCH_RESULTS);

  const [searchInput, setSearchInput] = useState('');
  const [activeKeywordTags, setActiveKeywordTags] = useState(["MrBeast", "Jimmy Donaldson", "Feastables", "Beast Industries", "Beast Games", "Beast Philanthropy", "MrBeast Burger", "MrBeast Productions"]);
  const [newTagInput, setNewTagInput] = useState('');
  const [dorkOperator, setDorkOperator] = useState('NONE');

  const [activeCategoryTab, setActiveCategoryTab] = useState('ALL');
  const [selectedSeverity, setSelectedSeverity] = useState('ALL');
  const [selectedStatus, setSelectedStatus] = useState('ALL');
  const [selectedAssignee, setSelectedAssignee] = useState('ALL');
  const [sortBy, setSortBy] = useState('newest');

  const [selectedResult, setSelectedResult] = useState(null);
  const [copyFeedback, setCopyFeedback] = useState(false);
  const [noteDraft, setNoteDraft] = useState('');

  const [showManualForm, setShowManualForm] = useState(false);
  const [manualDraft, setManualDraft] = useState({ title: '', url: '', source: '', category: CATEGORY_KEYS[0], severity: 'Medium', snippet: '' });

  const constructedSearchQuery = useMemo(() => {
    let base = searchInput.trim();
    if (!base && activeKeywordTags.length > 0) base = activeKeywordTags.map(t => `"${t}"`).join(' OR ');
    if (dorkOperator === 'PASTE') base = `site:pastebin.com OR site:justpaste.it ${base}`;
    if (dorkOperator === 'FORUMS') base = `site:reddit.com OR site:4chan.org ${base}`;
    if (dorkOperator === 'DOCS') base = `filetype:pdf OR filetype:xlsx "CONFIDENTIAL" ${base}`;
    if (dorkOperator === 'EXACT_PII') base = `${base} "Home Address" OR "Cell" OR "SSN"`;
    if (dorkOperator === 'BRAND') base = `${base} -site:{DOMAIN} "{COMPANY}"`;
    return base || '"Executive Name" "Home Address"';
  }, [searchInput, activeKeywordTags, dorkOperator]);

  const categoryCounts = useMemo(() => {
    const counts = {};
    CATEGORY_KEYS.forEach(k => (counts[k] = 0));
    searchResults.forEach(res => { if (counts[res.category] !== undefined) counts[res.category]++; });
    return counts;
  }, [searchResults]);

  const statusCounts = useMemo(() => {
    const counts = {};
    STATUS_STAGES.forEach(s => (counts[s] = 0));
    searchResults.forEach(r => { if (counts[r.status] !== undefined) counts[r.status]++; });
    return counts;
  }, [searchResults]);

  const filteredResults = useMemo(() => {
    const filtered = searchResults.filter(res => {
      const matchesCategory = activeCategoryTab === 'ALL' || res.category === activeCategoryTab;
      const matchesSeverity = selectedSeverity === 'ALL' || res.severity === selectedSeverity;
      const matchesStatus = selectedStatus === 'ALL' || res.status === selectedStatus;
      const matchesAssignee = selectedAssignee === 'ALL' || res.assignee === selectedAssignee;
      return matchesCategory && matchesSeverity && matchesStatus && matchesAssignee;
    });
    const getTime = r => r.detectedAtEpoch || 0;
    const sorted = [...filtered];
    if (sortBy === 'newest') sorted.sort((a, b) => getTime(b) - getTime(a));
    else if (sortBy === 'oldest') sorted.sort((a, b) => getTime(a) - getTime(b));
    else if (sortBy === 'riskHigh') sorted.sort((a, b) => b.riskScore - a.riskScore);
    else if (sortBy === 'riskLow') sorted.sort((a, b) => a.riskScore - b.riskScore);
    return sorted;
  }, [searchResults, activeCategoryTab, selectedSeverity, selectedStatus, selectedAssignee, sortBy]);

  const openCriticalCount = searchResults.filter(r => r.severity === 'Critical' && r.status !== 'Resolved').length;
  const openCasesCount = searchResults.filter(r => r.status !== 'Resolved').length;
  const avgRisk = Math.round(searchResults.reduce((a, r) => a + r.riskScore, 0) / (searchResults.length || 1));
  const categoryChartData = CATEGORY_KEYS.map(k => ({ name: k, value: categoryCounts[k], color: CATEGORY_STYLES[k].chart }));

      bing: `https://www.bing.com/search?q=${q}`,

                {CATEGORY_KEYS.map(c => <option key={c} value={c}>{c}</option>)}
              </select>
              <select value={selectedSeverity} onChange={e => setSelectedSeverity(e.target.value)} className="bg-slate-900 border border-slate-700 text-slate-300 text-xs rounded-lg px-2.5 py-1.5 focus:outline-none focus:border-emerald-500">
                <option value="ALL">All ratings</option><option value="Critical">Critical</option><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option>
              </select>
              <button onClick={() => setShowManualForm(v => !v)} title="Manually add something you found yourself" className="text-[11px] px-2.5 py-1 bg-emerald-500/10 hover:bg-emerald-500/20 text-emerald-300 rounded-lg border border-emerald-500/30 flex items-center space-x-1">
                <PlusCircle className="w-3.5 h-3.5" /><span>Log a finding</span>
              </button>
            </div>
          </div>
          {showManualForm && (
            <div className="p-5 bg-slate-900 border-b border-dashed border-slate-600 space-y-2 text-xs">
              <div className="grid grid-cols-2 gap-2">
                <input value={manualDraft.title} onChange={e => setManualDraft({ ...manualDraft, title: e.target.value })} placeholder="What did you find? (short title)" className="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
                <input value={manualDraft.url} onChange={e => setManualDraft({ ...manualDraft, url: e.target.value })} placeholder="Link to the page" className="bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
              </div>
              <input value={manualDraft.source} onChange={e => setManualDraft({ ...manualDraft, source: e.target.value })} placeholder="Where did you find it?" className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
              <div className="grid grid-cols-2 gap-2">
                <select value={manualDraft.category} onChange={e => setManualDraft({ ...manualDraft, category: e.target.value })} className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-300 focus:outline-none focus:border-emerald-500">
                  {CATEGORY_KEYS.map(c => <option key={c} value={c}>{c}</option>)}
                </select>
                <select value={manualDraft.severity} onChange={e => setManualDraft({ ...manualDraft, severity: e.target.value })} className="bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-300 focus:outline-none focus:border-emerald-500">
                  {['Low', 'Medium', 'High', 'Critical'].map(s => <option key={s} value={s}>{s}</option>)}
                </select>
              </div>
              <button onClick={handleAddManualResult} className="w-full py-1.5 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-semibold rounded-lg">Save this finding</button>
            </div>
          )}
          {filteredResults.length === 0 ? (
            <div className="p-12 text-center text-slate-400 space-y-2">
              <ShieldCheck className="w-10 h-10 mx-auto text-slate-500" />
              <p className="text-xs font-medium">Nothing here yet.</p>
              <p className="text-[11px] text-slate-500">The next scheduled sweep will fill this in.</p>
            </div>
          ) : (
            <div className="divide-y divide-slate-700/60">
              {filteredResults.map(result => (
                <div key={result.id} className="p-4 hover:bg-slate-700/20 transition-all flex flex-wrap items-start gap-3">
                  <div className={`shrink-0 w-16 text-center px-2 py-1.5 rounded-lg border text-[11px] font-bold ${SEVERITY_STYLES[result.severity]}`} title="Rating — how serious this looks">
                    <div>{result.severity.toUpperCase()}</div>
                    <div className="font-mono text-[10px] opacity-80">{result.riskScore}/100</div>
                  </div>
                  <div className="flex-1 min-w-0">
                    <div className="flex items-center flex-wrap gap-1.5 mb-1">
                      <span className={`text-[10px] font-medium px-1.5 py-0.5 rounded border ${CATEGORY_STYLES[result.category].text} ${CATEGORY_STYLES[result.category].softBg} ${CATEGORY_STYLES[result.category].border}`}>{result.category}</span>
                      <span className="text-[10px] text-slate-500">{result.source}</span>
                      <span className="text-[10px] text-slate-500 flex items-center"><Clock className="w-3 h-3 mr-0.5" />{result.detectedAt}</span>
                    </div>
                    <a href={result.url} target="_blank" rel="noopener noreferrer" className="text-sm font-semibold text-slate-100 hover:text-emerald-300 hover:underline flex items-center gap-1.5">
                      <span>{result.title}</span><ExternalLink className="w-3.5 h-3.5 shrink-0 opacity-60" />
                    </a>
                    <p className="text-xs text-slate-400 mt-1 line-clamp-2">{result.snippet}</p>
                  </div>
                  <button onClick={() => setSelectedResult(result)} className="shrink-0 px-2.5 py-1 bg-slate-700/60 hover:bg-slate-700 text-slate-300 text-[11px] font-medium rounded border border-slate-600 flex items-center space-x-1">
                    <Eye className="w-3 h-3" /><span>Details</span>
                  </button>
                </div>
              ))}
            </div>
          )}
        </section>
      </main>

      {selectedResult && (
        <div className="fixed inset-0 z-50 bg-slate-900/80 backdrop-blur-sm flex items-center justify-center p-5">
          <div className="bg-slate-800 border border-slate-700 rounded-2xl max-w-2xl w-full p-6 space-y-5 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div className="flex items-center justify-between border-b border-slate-700 pb-3">
              <div className="flex items-center space-x-2"><ShieldAlert className="w-5 h-5 text-rose-500" /><span className="text-xs font-mono font-bold text-slate-300">Finding #{selectedResult.id}</span></div>
              <button onClick={() => setSelectedResult(null)} className="text-slate-400 hover:text-slate-200"><X className="w-5 h-5" /></button>
            </div>
            <div className="space-y-4 text-xs">
              <div>
                <span className={`text-[10px] font-medium ${CATEGORY_STYLES[selectedResult.category].text}`}>{selectedResult.category}</span>
                <h3 className="text-base font-bold text-slate-100">{selectedResult.title}</h3>
              </div>
              <div>
                <p className="text-slate-400 mb-1.5">Where this stands — click a step to update it</p>
                <StatusStepper status={selectedResult.status} onChange={s => handleStatusChange(selectedResult.id, s)} />
              </div>
              <div className="grid grid-cols-2 gap-4">
                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2 font-mono text-[11px]">
                  <div className="flex justify-between"><span className="text-slate-400">Found via search:</span><span className="text-emerald-400 font-bold truncate ml-2">"{selectedResult.keywordMatched}"</span></div>
                  <div className="flex justify-between"><span className="text-slate-400">Found on:</span><span className="text-slate-300">{selectedResult.source}</span></div>
                  <div className="flex justify-between" title="How serious this looks, out of 100"><span className="text-slate-400">Risk score:</span><span className="text-rose-400 font-bold">{selectedResult.riskScore}/100</span></div>
                  <div className="flex justify-between items-center" title="How trustworthy this type of source usually is"><span className="text-slate-400">Source trust:</span><div className="flex items-center space-x-1.5"><ReliabilityDots score={SOURCE_RELIABILITY[selectedResult.sourceType] || 3} /><span className="text-slate-400">{SOURCE_RELIABILITY[selectedResult.sourceType] || 3}/5</span></div></div>
                </div>
                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 space-y-2">
                  <p className="text-slate-400 flex items-center"><Users className="w-3 h-3 mr-1" />Who's handling this</p>
                  <select value={selectedResult.assignee} onChange={e => handleAssign(selectedResult.id, e.target.value)} className="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1.5 text-slate-200 focus:outline-none focus:border-emerald-500">
                    {TEAM.map(t => <option key={t} value={t}>{t}</option>)}
                  </select>
                  <p className="text-slate-400 flex items-center pt-1"><MapPin className="w-3 h-3 mr-1" />Tags</p>
                  <div className="flex flex-wrap gap-1">
                    {selectedResult.tags.map(t => <span key={t} className="text-[10px] bg-slate-800 border border-slate-700 text-slate-400 px-1.5 py-0.5 rounded">{t}</span>)}
                  </div>
                </div>
              </div>
              <div>
                <span className="text-slate-400 font-semibold block mb-1">What was found</span>
                <div className="bg-slate-900 p-3 rounded-lg border border-slate-700 text-slate-300 leading-relaxed text-xs max-h-32 overflow-y-auto">{selectedResult.snippet}</div>
              </div>
              <div>
                <span className="text-slate-400 font-semibold flex items-center mb-1"><History className="w-3.5 h-3.5 mr-1.5" />Activity on this finding</span>
                <div className="space-y-1.5 max-h-32 overflow-y-auto">
                  {selectedResult.notes.length === 0 && <p className="text-slate-400 text-[11px]">No notes yet — add one below.</p>}
                  {selectedResult.notes.map((n, i) => (
                    <div key={i} className="bg-slate-900 border border-slate-700 rounded-lg p-2 text-[11px]">
                      <div className="flex items-center justify-between text-slate-400"><span className="font-semibold text-slate-300">{n.author}</span><span>{n.at}</span></div>
                      <p className="text-slate-400 mt-0.5">{n.text}</p>
                    </div>
                  ))}
                </div>
                <div className="flex items-center space-x-2 mt-2">
                  <input value={noteDraft} onChange={e => setNoteDraft(e.target.value)} placeholder="Add a note for the team..." className="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-emerald-500" />
                  <button onClick={() => handleAddNote(selectedResult.id)} className="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg font-medium shrink-0">Add</button>
                </div>
              </div>
            </div>
            <div className="pt-3 border-t border-slate-700 flex flex-wrap items-center justify-between gap-4">
              <a href={selectedResult.url} target="_blank" rel="noopener noreferrer" className="px-3 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 rounded-lg text-xs font-medium flex items-center space-x-1"><span>Open the page</span><ExternalLink className="w-3.5 h-3.5" /></a>
              <div className="flex space-x-2">
                <button onClick={() => { navigator.clipboard.writeText(`TAKEDOWN REQUEST FOR: ${selectedResult.url}\nMATCHED KEYWORD: ${selectedResult.keywordMatched}\nCONTENT: ${selectedResult.snippet}`); setCopyFeedback(true); setTimeout(() => setCopyFeedback(false), 2500); }} title="Copies a pre-written removal request you can paste into an email or web form" className="px-4 py-2 bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold rounded-lg text-xs flex items-center space-x-1">
                  <FileText className="w-3.5 h-3.5" /><span>{copyFeedback ? 'Copied!' : 'Copy removal request'}</span>
                </button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const __root = ReactDOM.createRoot(document.getElementById('root'));
__root.render(React.createElement(App));

</script>

<script>
  try {
    var code = document.getElementById('app-source').textContent;
    var transformed = Babel.transform(code, { presets: ['react'] }).code;
    var script = document.createElement('script');
    script.textContent = transformed;
    document.body.appendChild(script);
  } catch (err) {
    document.getElementById('root').innerHTML =
      '<div style="color:#f87171;padding:2rem;font-family:sans-serif;">Failed to start the app: ' + (err && err.message ? err.message : err) + '</div>';
    console.error(err);
  }
</script>
</body>
</html>
